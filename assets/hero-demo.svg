<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" role="img" aria-label="Sample Stingy Roast receipt and recorded token usage across three comparisons">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      .frame { fill: #161B22; stroke: #30363D; stroke-width: 1.5; }
      .panel { fill: #0D1117; stroke: #21262D; stroke-width: 1; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12.2px; }
      .mono text { white-space: pre; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #8B949E; font-weight: 600; }
      .c-dim { fill: #8B949E; }
      .c-white { fill: #E6EDF3; }
      .c-gold { fill: #F59E0B; font-weight: 700; }
      .c-green { fill: #3FB950; font-weight: 700; }
      .c-red { fill: #F85149; font-weight: 700; }
      .c-cyan { fill: #58A6FF; font-weight: 700; }
      .fade-1 { animation: reveal 0.4s ease-out 0.1s both; }
      .fade-2 { animation: reveal 0.4s ease-out 0.4s both; }
      .fade-3 { animation: reveal 0.4s ease-out 0.8s both; }
      .fade-4 { animation: reveal 0.4s ease-out 1.2s both; }
      @keyframes reveal {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .fade-1, .fade-2, .fade-3, .fade-4 { animation: none; }
      }
    </style>
  </defs>

  <!-- Outer Terminal Window -->
  <rect x="4" y="4" width="912" height="492" rx="12" class="frame"/>
  <rect x="4" y="4" width="912" height="38" rx="12" fill="#161B22"/>
  <line x1="4" y1="42" x2="916" y2="42" stroke="#30363D" stroke-width="1"/>

  <!-- macOS Traffic Lights -->
  <circle cx="24" cy="23" r="6" fill="#FF5F56"/>
  <circle cx="44" cy="23" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="23" r="6" fill="#27C93F"/>
  <text x="460" y="27" text-anchor="middle" class="title">stingy — zsh — 110×28</text>

  <!-- Left Pane: Public sample receipt -->
  <rect x="20" y="56" width="445" height="424" rx="8" class="panel"/>
  <g class="mono fade-1">
    <text x="34" y="78" class="c-green">$</text>
    <text x="48" y="78" class="c-white">stingy roast sample-session.jsonl</text>
  </g>

  <g class="mono fade-2" xml:space="preserve">
    <text x="34" y="102" class="c-gold">=================================================</text>
    <text x="34" y="119" class="c-gold">|           🪙 STINGY TOKEN AUTOPSY 🪙          |</text>
    <text x="34" y="136" class="c-dim">| PUBLIC SAMPLE TRANSCRIPT                      |</text>
    <text x="34" y="152" class="c-dim">|-----------------------------------------------|</text>
    <text x="34" y="169" class="c-white">| LOGS SCANNED: 1 file (13 steps)               |</text>
    <text x="34" y="185" class="c-dim">| ITEM                          QTY  EST. WASTE |</text>
    <text x="34" y="202" class="c-white">| Full-File Reads (No Range)     1x       2,800 |</text>
    <text x="34" y="219" class="c-white">| Duplicate File Re-Reads        1x       3,600 |</text>
    <text x="34" y="236" class="c-white">| Consecutive Cmd Retries        1x       2,400 |</text>
    <text x="34" y="253" class="c-white">| Frustration / Fix Prompts      1x         400 |</text>
    <text x="34" y="270" class="c-green">| Surgical Line-Range Reads      2x           0 |</text>
    <text x="34" y="287" class="c-green">| Targeted Grep Searches         1x           0 |</text>
    <text x="34" y="303" class="c-dim">|-----------------------------------------------|</text>
    <text x="34" y="320" class="c-white">| 10-COIN TURN BUDGET SCORE     8.75 / 10 Coins |</text>
    <text x="34" y="337" class="c-white">| BANKRUPT TURNS (&gt;10c)              1 / 2 turns |</text>
    <text x="34" y="353" class="c-dim">|-----------------------------------------------|</text>
    <text x="34" y="370" class="c-white">| EST. TOOL CONTEXT TOKENS               14,690 |</text>
    <text x="34" y="387" class="c-red">| AVOIDABLE WASTED TOKENS         9,200 (62.6%) |</text>
    <text x="34" y="404" class="c-dim">| MODEL COST ESTIMATES             stingy usage |</text>
    <text x="34" y="420" class="c-dim">|-----------------------------------------------|</text>
    <text x="34" y="438" class="c-cyan">| DIAGNOSIS: CONTEXT OVER-SPENDER               |</text>
    <text x="34" y="456" class="c-gold">=================================================</text>
  </g>

  <!-- Right Pane: Recorded usage across three comparisons -->
  <rect x="480" y="56" width="420" height="424" rx="8" class="panel"/>
  <g class="mono fade-3" xml:space="preserve">
    <text x="496" y="88" class="c-gold">TOTAL TOKENS ACROSS RECORDED RUNS</text>
    <text x="496" y="108" class="c-dim">Input (including cache) + output</text>
    <text x="496" y="128" class="c-dim">Full track = control · Green = Stingy</text>

    <text x="496" y="160" class="c-white">3,100-line bug hunt · Gemini 4 Argon</text>
    <text x="876" y="160" class="c-green" text-anchor="end">−83.89%</text>
    <rect x="496" y="171" width="380" height="10" rx="3" fill="#30363D"/>
    <rect x="496" y="171" width="61" height="10" rx="3" fill="#3FB950"/>
    <text x="496" y="201" class="c-dim">345,534 → 55,671 tokens · Scrooge</text>

    <text x="496" y="230" class="c-white">CRDT whiteboard · Gemini 4 Argon</text>
    <text x="876" y="230" class="c-green" text-anchor="end">−84.85%</text>
    <rect x="496" y="241" width="380" height="10" rx="3" fill="#30363D"/>
    <rect x="496" y="241" width="58" height="10" rx="3" fill="#3FB950"/>
    <text x="496" y="271" class="c-dim">353,105 → 53,497 tokens · Stingy Build</text>

    <text x="496" y="300" class="c-white">Codex · two bug fixes</text>
    <text x="876" y="300" class="c-green" text-anchor="end">−3.82%</text>
    <rect x="496" y="311" width="380" height="10" rx="3" fill="#30363D"/>
    <rect x="496" y="311" width="365" height="10" rx="3" fill="#3FB950"/>
    <text x="496" y="341" class="c-dim">191,228 → 183,916 tokens · Scrooge</text>
  </g>

  <!-- Aggregate Summary Box -->
  <g class="mono fade-4">
    <rect x="496" y="365" width="380" height="89" rx="6" fill="#161B22" stroke="#3FB950" stroke-width="1.2"/>
    <text x="512" y="389" class="c-white">CODEX SHELL OUTPUT · BYTES</text>
    <text x="512" y="412" class="c-green">61,131 → 13,010 (−78.7%)</text>
    <text x="512" y="435" class="c-dim">Both patches passed their tests.</text>
  </g>
</svg>
