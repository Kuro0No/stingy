      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12.2px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #8B949E; font-weight: 600; }
      .c-dim { fill: #8B949E; }
      .c-white { fill: #E6EDF3; }
      .c-gold { fill: #F59E0B; font-weight: 700; }
      .c-green { fill: #3FB950; font-weight: 700; }
      .c-red { fill: #F85149; font-weight: 700; }
      .c-cyan { fill: #58A6FF; font-weight: 700; }
      .fade-1 { animation: reveal 0.4s ease-out 0.1s both; }
      .fade-2 { animation: reveal 0.4s ease-out 0.4s both; }
      .fade-3 { animation: reveal 0.4s ease-out 0.8s both; }
      .fade-4 { animation: reveal 0.4s ease-out 1.2s both; }
      @keyframes reveal {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
